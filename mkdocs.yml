site_name: SLICE
site_description: Sparse, signed, deflationary factorization for single-cell gene programs
# repo_url, repo_name, edit_uri: set these once the repository is public --
# left unset rather than a fake URL, since MkDocs validates repo_url strictly
# (a placeholder string fails the build; an absent key does not).

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Preprocessing: preprocessing.md
  - Tutorials:
      - Reproducing the paper: reproducing-paper.md
      - Biological annotation and WGCNA-style reporting: annotation.md
  - Comparisons against other methods: comparisons.md
  - API reference: api.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            merge_init_into_class: true
